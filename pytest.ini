[pytest]
testpaths = .
python_files = test_*.py
norecursedirs =
    .venv
    .git
    .pytest_cache
    .pytest-tmp-*
    mcp-servers
    output
    runtime
    tmp
    pytest-cache-files-*
addopts = -p no:cacheprovider
filterwarnings =
    ignore:Data Validation extension is not supported and will be removed:UserWarning
