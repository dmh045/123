version: "1.0-baseline"
source: "VDA 702 (2023)"
# vda702_atoms.yaml
# Skill 资产 — atom 级数据库
# 每个 atom 都能溯源到 VDA 702 V2 §5.3 原文 或 source HARA 表
#
# Schema 约定:
#   id     - VDA atom ID (FA001, FB002, ...). CN 新增用 "CN_xxx" 前缀
#   label  - 短描述
#   dim    - 归属维度: WHERE | ROAD | EGO_ACTION | EGO_X_ROAD | TRAFFIC_PATTERN | EGO_DYNAMICS | OBJECT
#            复合 atom 用 "A+B" 形式 (如 EGO_ACTION+EGO_DYNAMICS)
#   ver    - 语义版本: V1 | V2 | both | non_vda (Audi/VW/CN)
#   e_t    - E_time (E1-E4 或 null/dash/tbd)
#   e_f    - E_freq (E1-E4 或 null/dash/tbd)
#   src    - 来源 tag (见下方 source_tags)
#   v1 / v2 - 跨版本对应 ID (如果有)
#
# 缺值表示:
#   null  - source 中明确空白
#   dash  - source 标 "-" / "--" / "[---]" (该维度不适用)
#   tbd   - source 标 "tbd" (待评估)

schema_version: "1.0"

source_tags:
  V2-Std:  "VDA 702 V2 (2023-06) §5.3 原文 PDF"
  Src-CN:  "source HARA 表 (MQB Baseline V1/V2, EHYREEV) 中实际出现"
  Src-CN+: "source HARA 表标 'New item from CN' 的新增"
  Audi:    "source 标 'Audi E-Value' / 'Audi E-Werte'"
  VW:      "source 标 'VW rating' / 'VW Abschätzung'"
  Rating:  "source 标 'Rating' / 'Estimation' / 'Abschätzung' 来源未明"

e_value_levels:
  E1: "<1% Fahrzeit oder <1x/Jahr"
  E2: "1-10% Fahrzeit oder wenige Male/Jahr"
  E3: "10-100% Fahrzeit oder monatlich"
  E4: "fast jede Fahrt oder >100x/Jahr"

# ═══════════════════════════════════════════════════════════════
# atoms — 主清单
# 按维度分段, 每条都可溯源
# ═══════════════════════════════════════════════════════════════
atoms:

  # ─────────────────────────────────────────────────────────────
  # WHERE — 静态环境
  # V2 VD 前缀 (来自 VDA 702 V2 §5.3 + source 现状.md 静态环境表)
  # ─────────────────────────────────────────────────────────────
  - {id: VD001, label: "Verkehrsberuhigte Zone / Traffic calmed area",        dim: WHERE, ver: V2, e_t: E2, e_f: E3, src: V2-Std, v1: FO070}
  - {id: VD002, label: "30 kph zone / Residential street",                    dim: WHERE, ver: V2, e_t: E3, e_f: E4, src: V2-Std, v1: FO080}
  - {id: VD003, label: "City road / Innerstädtische Straße",                  dim: WHERE, ver: V2, e_t: E4, e_f: E4, src: V2-Std, v1: FO050}
  - {id: VD004, label: "Arterial thoroughfare / Durchgangsstraße",            dim: WHERE, ver: V2, e_t: E4, e_f: E4, src: V2-Std}
  - {id: VD005, label: "Rural road / Country road / Landstraße",              dim: WHERE, ver: V2, e_t: E4, e_f: E4, src: V2-Std, v1: FO040}
  - {id: VD006, label: "Motorway / Schnellstraße / Autobahn",                 dim: WHERE, ver: V2, e_t: E4, e_f: E3, src: V2-Std, v1: FO010}
  - {id: VD007, label: "Motorway entrance / Autobahnauffahrt",                dim: WHERE, ver: V2, e_t: E2, e_f: E3, src: V2-Std, v1: FO020}
  - {id: VD008, label: "Motorway exit / Autobahnausfahrt",                    dim: WHERE, ver: V2, e_t: E2, e_f: E3, src: V2-Std, v1: FO030}
  - {id: VD009, label: "Driving alongside on-/off-ramp (no intent to exit)",  dim: WHERE, ver: V2, e_t: E2, e_f: E3, src: V2-Std}
  - {id: VD010, label: "Lane splits into two on motorway",                    dim: WHERE, ver: V2, e_t: E2, e_f: E2, src: V2-Std}
  - {id: VD011, label: "Manual toll station",                                 dim: WHERE, ver: V2, e_t: E2, e_f: E3, src: V2-Std}
  - {id: VD012, label: "Driving on hard shoulder opened by dynamic signage",  dim: WHERE, ver: V2, e_t: E2, e_f: E3, src: V2-Std}
  - {id: VD013, label: "Parking in garage with direct link to living area",   dim: WHERE, ver: V2, e_t: E2, e_f: E2, src: V2-Std,
     note: "VD 类别下但描述'停车 × 车库'复合, 焦点是中毒风险, 仍按场所处理"}
  - {id: VD014, label: "Tunnel",                                              dim: WHERE, ver: V2, e_t: E2, e_f: E3, src: V2-Std, v1: FO110}
  - {id: VD015, label: "Pass road / Passstraße",                              dim: WHERE, ver: V2, e_t: E2, e_f: E2, src: V2-Std, v1: FO060}
  - {id: VD016, label: "Crossing / Roundabout",                               dim: WHERE, ver: V2, e_t: E3, e_f: E4, src: V2-Std,
     note: "VDA 归 VD 类别, 描述过交叉口动作; HARA 工程实践常作动作处理, 允许 EGO_ACTION 引用"}
  - {id: VD017, label: "Construction site (motorway) with structural separation",    dim: WHERE, ver: V2, e_t: E3, e_f: E3, src: V2-Std, v1: FO090,
     cross_version_e_conflict: "V1 FO090 在 source 中 E2/dash, V2 VD017 在 PDF E3/E3"}
  - {id: VD018, label: "Construction site (motorway) without structural separation", dim: WHERE, ver: V2, e_t: E2, e_f: E1, src: V2-Std, v1: FO100,
     cross_version_e_conflict: "V1 FO100 在 source 中 E2/dash, V2 VD018 在 PDF E2/E1"}
  - {id: VD019, label: "Bahnübergang / Railroad crossing",                    dim: WHERE, ver: V2, e_t: E1, e_f: E3, src: V2-Std, v1: FO120}
  - {id: VD020, label: "Field / forest roads",                                dim: WHERE, ver: V2, e_t: E2, e_f: E3, src: V2-Std}
  - {id: VD021, label: "Cycle street (Fahrradstraße)",                        dim: WHERE, ver: V2, e_t: E2, e_f: E1, src: V2-Std}

  # ─── V1 FO 前缀 (Src-CN: 现状.md V1 表) ───
  - {id: FO010, label: "Motorway / Highway (V1)",                             dim: WHERE, ver: V1, e_t: E4, e_f: E3, src: Src-CN, v2: VD006}
  - {id: FO020, label: "Motorway entrance (V1)",                              dim: WHERE, ver: V1, e_t: E2, e_f: E3, src: Src-CN, v2: VD007}
  - {id: FO030, label: "Motorway exit (V1)",                                  dim: WHERE, ver: V1, e_t: E2, e_f: E3, src: Src-CN, v2: VD008}
  - {id: FO040, label: "Country road (V1)",                                   dim: WHERE, ver: V1, e_t: E4, e_f: E4, src: Src-CN, v2: VD005}
  - {id: FO050, label: "City traffic (V1)",                                   dim: WHERE, ver: V1, e_t: E4, e_f: E4, src: Src-CN, v2: VD003}
  - {id: FO060, label: "Pass road (V1)",                                      dim: WHERE, ver: V1, e_t: E2, e_f: E2, src: Src-CN, v2: VD015}
  - {id: FO070, label: "Traffic-free / calmed area (V1)",                     dim: WHERE, ver: V1, e_t: E2, e_f: E3, src: Src-CN, v2: VD001}
  - {id: FO080, label: "30 kph zone (V1)",                                    dim: WHERE, ver: V1, e_t: E3, e_f: E4, src: Src-CN, v2: VD002}
  - {id: FO090, label: "Construction site with structural separation (V1)",   dim: WHERE, ver: V1, e_t: E2, e_f: dash, src: Src-CN, v2: VD017}
  - {id: FO100, label: "Construction site without structural separation (V1)",dim: WHERE, ver: V1, e_t: E2, e_f: dash, src: Src-CN, v2: VD018}
  - {id: FO110, label: "Tunnel (V1)",                                         dim: WHERE, ver: V1, e_t: E2, e_f: E3, src: Src-CN, v2: VD014}
  - {id: FO120, label: "Railroad crossing (V1)",                              dim: WHERE, ver: V1, e_t: E1, e_f: E3, src: Src-CN, v2: VD019}

  # ─── V1 SO 前缀 (Src-CN: 用作场所; V2 SO 已改义为 Sondersituationen) ───
  - {id: SO010, label: "Parkplatz / Parkhaus / Garage (V1 usage)",            dim: WHERE, ver: V1, e_t: E4, e_f: E4, src: Src-CN,
     note: "⚠ V1 数据中作场所; V2 标准 SO 类别 = Sondersituationen, 含义完全不同"}
  - {id: SO020, label: "Parkplatz / Parkhaus / Garage (V1 usage)",            dim: WHERE, ver: V1, e_t: E4, e_f: E4, src: Src-CN}
  - {id: SO030, label: "Straßenrand Stadt (V1 usage)",                        dim: WHERE, ver: V1, e_t: E4, e_f: E4, src: Src-CN}

  # ─── CN 扩展 (Src-CN+) ───
  - {id: CN_on_off_ramp_city_expressway, label: "On/off ramp of city expressway", dim: WHERE, ver: non_vda, e_t: E3, e_f: E4, src: Src-CN+}
  - {id: CN_expressway,                  label: "Expressway (CN inner city max 60-100 kph)", dim: WHERE, ver: non_vda, e_t: E4, e_f: E4, src: Src-CN+,
     note: "Inner city roads designed for max 60-100 kph. RHP mainly designed for this"}
  - {id: CN_bridge,                      label: "Bridge",                          dim: WHERE, ver: non_vda, e_t: E3, e_f: E3, src: Src-CN+}
  - {id: CN_parking_multistory,          label: "Parking in a multi-story car park/garage", dim: WHERE, ver: non_vda, e_t: E4, e_f: E4, src: Src-CN+,
     note: "Most vehicles in CN are parked in multi-story car parks"}

  # ─── WHERE_MICRO (静态路型, 弯道) ───
  - {id: CN_sharp_curve,    label: "Sharp curve (radius < 500m)",      dim: WHERE_MICRO, ver: non_vda, e_t: E2, e_f: tbd, src: Src-CN+}
  - {id: CN_curve,          label: "Curve (radius > 500m)",            dim: WHERE_MICRO, ver: non_vda, e_t: E3, e_f: tbd, src: Src-CN+}
  - {id: CN_elongated_curve,label: "Elongated curve (radius >> 500m)", dim: WHERE_MICRO, ver: non_vda, e_t: E4, e_f: tbd, src: Src-CN+}

  # ─────────────────────────────────────────────────────────────
  # ROAD — 路面情况 / 天气
  # ─────────────────────────────────────────────────────────────
  # ─── V2 FB 前缀 (V2-Std: 路面状况; ⚠ 与 V1 FB=动作/速度 完全不同) ───
  - {id: FB001, label: "Slight slope ≤ 2% (driving on)",               dim: ROAD, ver: V2, e_t: E4, e_f: E4, src: V2-Std}
  - {id: FB002, label: "Medium slope > 2% (driving on, V2 std)",       dim: ROAD, ver: V2, e_t: E3, e_f: E4, src: V2-Std,
     inconsistency: "source HARA 表把 FB002 用作'停在坡上 2-8%' (V1 语义), 归 EGO_X_ROAD. V2 标准是'行驶在坡上 >2%'"}
  - {id: FB003, label: "Strong slope > 8% (driving on, V2 std)",       dim: ROAD, ver: V2, e_t: E2, e_f: E3, src: V2-Std,
     inconsistency: "source HARA 表把 FB003 用作'停在坡上 >8%' (V1 语义), 归 EGO_X_ROAD"}
  - {id: FB004, label: "Splitt / gravel",                              dim: ROAD, ver: V2, e_t: E2, e_f: E2, src: V2-Std}
  - {id: FB005, label: "Normal friction coefficient",                  dim: ROAD, ver: V2, e_t: E4, e_f: E4, src: V2-Std}
  - {id: FB006, label: "Reduced friction (µ < 0.8)",                   dim: ROAD, ver: V2, e_t: E3, e_f: E3, src: V2-Std}
  - {id: FB007, label: "Low friction (µ < 0.5, snow/ice)",             dim: ROAD, ver: V2, e_t: E2, e_f: E2, src: V2-Std}
  - {id: FB008, label: "µ-split (delta-µ > 0.3 left/right)",           dim: ROAD, ver: V2, e_t: E1, e_f: E2, src: V2-Std}
  - {id: FB009, label: "µ-jump (longitudinal transition)",             dim: ROAD, ver: V2, e_t: dash, e_f: E3, src: V2-Std}
  - {id: FB010, label: "Significant vertical excitation (pothole)",    dim: ROAD, ver: V2, e_t: E3, e_f: E3, src: V2-Std,
     warning: "⚠ V2 含义=路面振动, 与 V1 FB010=Drive v>130kph 完全不同 ID 冲突"}
  - {id: FB011, label: "Cobblestone road",                             dim: ROAD, ver: V2, e_t: E3, e_f: E3, src: V2-Std}
  - {id: FB012, label: "Rails on roadway (tram)",                      dim: ROAD, ver: V2, e_t: E2, e_f: E3, src: V2-Std}

  # ─── V2 WS 前缀 (V2-Std: 天气/能见度) ───
  - {id: WS001, label: "Hail (Hagel)",                                 dim: ROAD, ver: V2, e_t: E1, e_f: E1, src: V2-Std}
  - {id: WS002, label: "Snowfall (Schneefall)",                        dim: ROAD, ver: V2, e_t: E2, e_f: E2, src: V2-Std}
  - {id: WS005, label: "Heavy rain > 20 l/h/m²",                       dim: ROAD, ver: V2, e_t: E2, e_f: E2, src: V2-Std}
  - {id: WS006, label: "Very heavy rain > 25 l/h/m²",                  dim: ROAD, ver: V2, e_t: E1, e_f: E1, src: V2-Std}
  - {id: WS007, label: "Darkness without residual light",              dim: ROAD, ver: V2, e_t: E3, e_f: E2, src: V2-Std}
  - {id: WS008, label: "Darkness with residual light",                 dim: ROAD, ver: V2, e_t: E4, e_f: E4, src: V2-Std}
  - {id: WS009, label: "Poor visibility < 150 m",                      dim: ROAD, ver: V2, e_t: E3, e_f: E3, src: V2-Std}
  - {id: WS010, label: "Poor visibility < 50 m",                       dim: ROAD, ver: V2, e_t: E2, e_f: E2, src: V2-Std}
  - {id: WS011, label: "Strong crosswind (needs counter-steering)",    dim: ROAD, ver: V2, e_t: E1, e_f: E2, src: V2-Std}

  # ─────────────────────────────────────────────────────────────
  # EGO_ACTION — 自车动作
  # ─────────────────────────────────────────────────────────────
  # ─── V2 FA 前缀 (动作子集; 速度/加速度档归 EGO_DYNAMICS) ───
  - id: FA005
    label: "Slow driving / starting (0 < v ≤ 15 kph in V2-Std; source HARA: 0<v<12)"
    dim: EGO_ACTION+EGO_DYNAMICS
    ver: V2
    e_t: E3
    e_f: E4
    src: V2-Std
    compound: {fills: [EGO_ACTION, EGO_DYNAMICS], ego_dynamics: {v_range_kph: [0, 15]}}
    inconsistency: "V2-Std 边界 ≤15 kph; source HARA 写 <12 kph"
    v1: FB040
  - {id: FA030, label: "Lane change (normal)",                         dim: EGO_ACTION, ver: V2, e_t: E3, e_f: E4, src: V2-Std, v1: FB150}
  - {id: FA031, label: "Lane change (risky / forced / avoidance)",     dim: EGO_ACTION, ver: V2, e_t: E1, e_f: E2, src: V2-Std}
  - id: FA033
    label: "Reversing (v ≤ 10 kph, incl. parking/maneuvering)"
    dim: EGO_ACTION+EGO_DYNAMICS
    ver: V2
    e_t: E2
    e_f: E4
    src: V2-Std
    compound: {fills: [EGO_ACTION, EGO_DYNAMICS], ego_dynamics: {direction: reverse, v_max_kph: 10}}
    v1: FB160
  - id: FA034
    label: "Reversing (v > 10 kph)"
    dim: EGO_ACTION+EGO_DYNAMICS
    ver: V2
    e_t: E1
    e_f: E2
    src: V2-Std
    compound: {fills: [EGO_ACTION, EGO_DYNAMICS], ego_dynamics: {direction: reverse, v_min_kph: 10}}
  - {id: FA037, label: "Overtaking with lane change on opposite lane (normal dist)", dim: EGO_ACTION, ver: V2, e_t: E2, e_f: E3, src: V2-Std}
  - {id: FA040, label: "(Left/right) turn (normal distance)",          dim: EGO_ACTION, ver: V2, e_t: E3, e_f: E4, src: V2-Std}
  - {id: FA042, label: "Turn across oncoming lane in dense traffic",   dim: EGO_ACTION, ver: V2, e_t: E2, e_f: E3, src: V2-Std}

  # ─── V2 PH 前缀 (全部为停留/挪车动作) ───
  - {id: PH001, label: "Parking in/out with trailer",                  dim: EGO_ACTION, ver: V2, e_t: E1, e_f: E2, src: V2-Std}
  - {id: PH002, label: "Parking/holding with driver in vehicle",       dim: EGO_ACTION, ver: V2, e_t: E3, e_f: E4, src: V2-Std}
  - {id: PH003, label: "Parking/holding: driver not in vehicle",       dim: EGO_ACTION, ver: V2, e_t: E4, e_f: E4, src: V2-Std}
  - {id: PH004, label: "Parking/holding: driver out, passengers in",   dim: EGO_ACTION, ver: V2, e_t: E3, e_f: E3, src: V2-Std}
  - {id: PH005, label: "Parking in or out",                            dim: EGO_ACTION, ver: V2, e_t: E3, e_f: E4, src: V2-Std, v1: FV010}
  - {id: PH006, label: "Parking in/out longitudinal direction",        dim: EGO_ACTION, ver: V2, e_t: E2, e_f: E3, src: V2-Std, v1: FV020}
  - {id: PH007, label: "Parking in/out transverse direction",          dim: EGO_ACTION, ver: V2, e_t: E3, e_f: E4, src: V2-Std, v1: FV030}
  - {id: PH008, label: "Halten: roadside in city",                     dim: EGO_ACTION, ver: V2, e_t: E3, e_f: E3, src: V2-Std}
  - {id: PH009, label: "Parking: roadside in city",                    dim: EGO_ACTION, ver: V2, e_t: E4, e_f: E4, src: V2-Std}
  - {id: PH010, label: "Parking/holding: roadside rural road",         dim: EGO_ACTION, ver: V2, e_t: E2, e_f: E2, src: V2-Std}
  - {id: PH011, label: "Parking/holding: shoulder of motorway",        dim: EGO_ACTION, ver: V2, e_t: E1, e_f: E1, src: V2-Std}
  - {id: PH015, label: "Traffic-induced halt on road",                 dim: EGO_ACTION, ver: V2, e_t: E4, e_f: E4, src: V2-Std, v1: FV060}
  - {id: PH016, label: "Traffic-induced halt with front vehicle + peds between", dim: EGO_ACTION, ver: V2, e_t: E2, e_f: E3, src: V2-Std}
  - {id: PH017, label: "Traffic-induced halt at first position",       dim: EGO_ACTION, ver: V2, e_t: E3, e_f: E4, src: V2-Std, v1: FV070}

  # ─── V2 PU 前缀 (动作子集: 跟车/堵车) ───
  - id: PU008
    label: "Traffic jam / Stop&Go on motorway+rural road"
    dim: EGO_ACTION+TRAFFIC_PATTERN
    ver: V2
    e_t: E3
    e_f: E3
    src: V2-Std
    compound: {fills: [EGO_ACTION, TRAFFIC_PATTERN], pattern: jam_motorway_or_rural}
  - id: PU009
    label: "Traffic jam in city"
    dim: EGO_ACTION+TRAFFIC_PATTERN
    ver: V2
    e_t: E3
    e_f: E3
    src: V2-Std
    compound: {fills: [EGO_ACTION, TRAFFIC_PATTERN], pattern: jam_city}
  - id: PU015
    label: "Following at normal distance (>=1/2 speedometer)"
    dim: EGO_ACTION+OBJECT
    ver: V2
    e_t: E4
    e_f: E4
    src: V2-Std
    compound: {fills: [EGO_ACTION, OBJECT], object: {position: front, type: vehicle, distance: normal}}
  - id: PU016
    label: "Following at short distance (<1/2 speedometer)"
    dim: EGO_ACTION+OBJECT
    ver: V2
    e_t: E4
    e_f: E4
    src: V2-Std
    compound: {fills: [EGO_ACTION, OBJECT], object: {position: front, type: vehicle, distance: short}}

  # ─── V1 FV 前缀 (全部动作) ───
  - {id: FV010, label: "Parking in/out (V1)",                          dim: EGO_ACTION, ver: V1, e_t: E3, e_f: E4, src: Src-CN, v2: PH005}
  - {id: FV020, label: "Parking longitudinal (V1)",                    dim: EGO_ACTION, ver: V1, e_t: E2, e_f: E3, src: Src-CN, v2: PH006}
  - {id: FV030, label: "Parking transverse (V1)",                      dim: EGO_ACTION, ver: V1, e_t: E3, e_f: E4, src: Src-CN, v2: PH007}
  - {id: FV060, label: "Stop (light/sign/crosswalk) (V1)",              dim: EGO_ACTION, ver: V1, e_t: E4, e_f: E4, src: Src-CN, v2: PH015}
  - {id: FV070, label: "Stop first place (V1)",                        dim: EGO_ACTION, ver: V1, e_t: E3, e_f: E4, src: Src-CN, v2: PH017}
  - {id: FV080, label: "Crossing intersection (V1)",                   dim: EGO_ACTION, ver: V1, e_t: E3, e_f: E4, src: Src-CN, v2: VD016}
  - {id: FV090, label: "Left turn normal distance (V1)",               dim: EGO_ACTION, ver: V1, e_t: E3, e_f: E4, src: Src-CN, v2: FA040}
  - {id: FV100, label: "Free travel (V1)",                             dim: EGO_ACTION, ver: V1, e_t: E4, e_f: E4, src: Src-CN}
  - {id: FV110, label: "Follow normal distance (V1)",                  dim: EGO_ACTION, ver: V1, e_t: E4, e_f: E4, src: Src-CN, v2: PU015}

  # ─── V1 FB 前缀白名单 (动作语义, 同 ID V2 FB 含义完全不同) ───
  - id: FB040
    label: "Slow drive (0 < v < 12 kph) (V1)"
    dim: EGO_ACTION+EGO_DYNAMICS
    ver: V1
    e_t: E3
    e_f: E4
    src: Src-CN
