# 已知的跨版本 E 值冲突 (Atom 同 ID 不同版本给出不同 E 值)
# 用于 audit; 不阻塞生成, 但记录留痕
# ═══════════════════════════════════════════════════════════════
cross_version_e_conflicts:
  - atom_pair: [FO090, VD017]
    v1_e: {t: E2, f: dash}
    v2_e: {t: E3, f: E3}
    resolution: "prefer V2 + audit V1 as historical record"
  - atom_pair: [FO100, VD018]
    v1_e: {t: E2, f: dash}
    v2_e: {t: E2, f: E1}
    resolution: "prefer V2 + audit V1 as historical record"

# ═══════════════════════════════════════════════════════════════
# 同 ID 跨版本语义冲突 (危险: 同 ID 不同 ver 含义完全不同)
# 必须在 atom 引用时校验 ver 字段, 不能仅按 ID 取
# ═══════════════════════════════════════════════════════════════
critical_id_collisions:
  - id: FB010
    v1_meaning: "Drive v > 130 kph (动作/动力学)"
    v1_dimension: EGO_DYNAMICS
    v2_meaning: "Significant vertical excitation / pothole (路面状况)"
    v2_dimension: ROAD
    note: "完全不同维度. 必须按 ver 字段判断"
  - id: FB002
    v1_semantics_in_source: "Stopping on mountain 2-8% (V1 语义被 source 套用)"
    v1_dimension: EGO_X_ROAD
    v2_meaning: "Driving on medium slope > 2% (V2-Std 标准)"
    v2_dimension: ROAD
    note: "source HARA 表用 V1 语义, V2 标准是不同含义. 看 atom entry 中的 inconsistency 标注"
  - id: FB003
    v1_semantics_in_source: "Stopping on mountain > 8%"
    v1_dimension: EGO_X_ROAD
    v2_meaning: "Driving on strong slope > 8%"
    v2_dimension: ROAD

# ═══════════════════════════════════════════════════════════════
# atom 数量统计 (生成时校验用)
# ═══════════════════════════════════════════════════════════════
expected_counts:
  # PR B：含 fills 口径 — compound atom 在 fills 多个维度都计 1 次。
  # WHERE_MICRO atoms 已合并到 WHERE 维度（loader _SUB_DIM_MERGE）。
  by_dimension:
    WHERE: 61            # VD/FO/SO/CN base + compound fills + WHERE_MICRO 3 条
    ROAD: 21             # FB x12 + WS x9
    EGO_ACTION: 40       # FA/PH/PU/FV/FX base + compound fills
    EGO_X_ROAD: 7        # FB002/003-as-used + PH012-014 + FV040/050
    TRAFFIC_PATTERN: 12  # CN base + compound fills（含 FA025/FA026 进 TRAFFIC_PATTERN）
    EGO_DYNAMICS: 59     # FA001-029 + Audi/VW/Rating + V1 FB + CN-extra + compound fills
    OBJECT: 23           # PU/XP/CN-extensions + compound fills
  by_source:
    V2-Std: ~75
    Src-CN: ~45
    Src-CN+: ~30
    Audi: 10
    VW: 4
    Rating: 1