    rationale: "The values express the same degraded-performance failure type."
  - mapping_id: FMSEL-FAIL-003
    selector_type: FAILURE_TYPE
    source_template_value: loss_of_function
    canonical_target: loss
    mapping_semantics: EXACT_EQUIVALENT
