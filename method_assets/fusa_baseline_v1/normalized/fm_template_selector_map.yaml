  - mapping_id: FMSEL-FAIL-010
    selector_type: FAILURE_TYPE
    source_template_value: no_detection
    canonical_target: ""
    candidate_targets: [loss, wrong_value]
    mapping_semantics: AMBIGUOUS
    runtime_status: UNRESOLVED
    rationale: "The template selector does not distinguish complete sensing loss from a selective wrong detection."
  - mapping_id: FMSEL-FAIL-011
    selector_type: FAILURE_TYPE
    source_template_value: obstacle_miss
    canonical_target: ""
    candidate_targets: [loss, wrong_value]
    mapping_semantics: AMBIGUOUS
    runtime_status: UNRESOLVED
    rationale: "The template selector does not distinguish a missing detection from an incorrect perception result."
