  - mapping_id: FMSEL-FAIL-005
    selector_type: FAILURE_TYPE
    source_template_value: excessive_output
    canonical_target: excessive
    mapping_semantics: EXACT_EQUIVALENT
    runtime_status: ACTIVE
    rationale: "The values express the same excessive-output failure type."
  - mapping_id: FMSEL-FAIL-006
    selector_type: FAILURE_TYPE
    source_template_value: drift
    canonical_target: wrong_value
    mapping_semantics: EXACT_EQUIVALENT
    runtime_status: ACTIVE
    rationale: "Drift is an output value deviation, covered by wrong_value."
  - mapping_id: FMSEL-FAIL-007
    selector_type: FAILURE_TYPE
    source_template_value: incorrect_output
    canonical_target: wrong_value
    mapping_semantics: EXACT_EQUIVALENT
    runtime_status: ACTIVE
    rationale: "Incorrect output is the template-specific expression of wrong_value."
  - mapping_id: FMSEL-FAIL-008
    selector_type: FAILURE_TYPE
    source_template_value: unintended_deactivation
    canonical_target: unintended_activation
    mapping_semantics: EXACT_EQUIVALENT
    runtime_status: ACTIVE
    rationale: "The taxonomy's unintended activation denotes an unplanned state transition; the template names its deactivation direction."
  - mapping_id: FMSEL-FAIL-009
    selector_type: FAILURE_TYPE
    source_template_value: path_deviation
    canonical_target: wrong_value
    mapping_semantics: EXACT_EQUIVALENT
    runtime_status: ACTIVE
